version: '3.8'

services:
  messengertest:
      build: .
      container_name: messengertest
      restart: unless-stopped
      depends_on:
        - dbtest
      environment:
        DB_HOST: dbtest
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: 123
        DB_NAME: project_farm
      ports:
        - "8086:8086"